<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="A basic HTML, CSS and JavaScript Calculator">
    <meta name="author" content="Cameron Abshear">
    <link rel="stylesheet" href="CSS/stylesheet.css">
    <script src="JS/javascript.js" defer></script>
</head>

<body>
    <!--main div container for the calculator-->
    <div class="calculator">
        <!--this inpput displays the result of the calcutiaon-->
        <input type="text" class="calculatorScreen" value="0" disabled>
        <!--this section displays all buttons that a user can pres to make a calculation-->
        <div class="calculatorKeys">
            
            <button type="button" class="operator" value="+">+</button>
            <button type="button" class="operator" value="-">-</button>
            <button type="button" class="operator" value="*">&times;</button>
            <button type="button" class="operator" value="/">&divide;</button>

            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>

            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>

            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>

            <button type="button" value="0">0</button>
            <button type="button" class="decimal" value=".">.</button>
            <button type="button" class="allClear" value="allClear">AC</button>

            <button type="button" class="equalSign operator" value="=">=</button>

        </div>
    </div>
</body>

</html>
